name: BidBazaar CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend and frontend dependencies
        run: |
          npm ci --prefix Backend
          npm ci --prefix Backend/auth
          npm ci --prefix Backend/cart
          npm ci --prefix Backend/dashboard
          npm ci --prefix Backend/features
          npm ci --prefix Backend/inventory
          npm ci --prefix Backend/mail
          npm ci --prefix Backend/payment
          npm ci --prefix Frontend

      - name: Run project verification
        run: npm run verify
